<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zahra Mohammadi Cinema 🎥</title>
  <!-- <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet"> -->
  <link rel="stylesheet" href="styl.css">
</head>
<body>

  <div class="container">
    <div class="marquee">
       Welcome to Zahra Mohammadi's Cinema 🎥
    </div>
    

    <h3>Zahra's Favorite Movie 🎬 </h3>

    <div class="video-container">
        <video width="500" height="200" controls>
          <source src="favmovie/myviedeo.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
      
      

    
    <div class="buttons">
      <button class="btn" onclick="location.reload()">Play Again 🎥</button>
      <button class="btn" onclick="alert('Thanks for Your rating My Friend!')">Rate Movie 🌟</button>
    </div>


    <div class="rate">
      <h2>Rate this Movie ⭐</h2>
      <div class="stars" id="star-rating">
        <span class="star" onclick="rateMovie(1)">⭐</span>
        <span class="star" onclick="rateMovie(2)">⭐</span>
        <span class="star" onclick="rateMovie(3)">⭐</span>
        <span class="star" onclick="rateMovie(4)">⭐</span>
        <span class="star" onclick="rateMovie(5)">⭐</span>
      </div>
      <div id="rating-message"></div>
    </div>
  </div>

  <script>
    function rateMovie(starCount) {
      const stars = document.querySelectorAll('.star');
      stars.forEach((star, index) => {
        if (index < starCount) {
          star.classList.add('filled');
        } else {
          star.classList.remove('filled');
        }
      });
      document.getElementById('rating-message').textContent = `You rated this movie with ${starCount} star(s) !`;
    }
  </script>

</body>
</html>
